<title>Dorm Packer 3000</title>
<style>
  :root{
    --desktop:#5f6f66;      /* dusty sage */
    --desktop-2:#4a574f;
    --surface:#efe7d6;      /* soft warm paper */
    --panel:#e7dcc4;
    --ink:#3a332b;          /* warm dark brown, not black */
    --ink-soft:#7a7062;
    --accent:#b56a4a;       /* muted terracotta */
    --accent-ink:#f6efe6;
    --sun:#c9a25e;          /* muted ochre */
    --line:#4a4136;
    --bevel-hi:#faf5ea;
    --bevel-lo:#b3a988;
    --bevel-lo-2:#8a7f66;
    --chrome:#ddd0b3;
    --titlebar:#4a4136;
    --good:#6b8a68;         /* muted sage green */
    --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Verdana","Geneva",Tahoma,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    min-height:100vh;
    background:
      repeating-linear-gradient(45deg,transparent 0 16px,rgba(0,0,0,.02) 16px 17px),
      radial-gradient(140% 120% at 50% 0%,var(--desktop) 0%,var(--desktop-2) 100%);
    padding:22px 14px 60px;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .window{
    width:100%;
    max-width:860px;
    background:var(--chrome);
    border:2px solid var(--line);
    box-shadow:
      inset 2px 2px 0 var(--bevel-hi),
      inset -2px -2px 0 var(--bevel-lo),
      4px 4px 0 rgba(0,0,0,.14);
  }
  /* ---- title bar ---- */
  .titlebar{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#3a332a,#241f1a);
    color:#f5edda;
    padding:6px 8px;
    border-bottom:2px solid var(--line);
    font-family:var(--mono);
    font-weight:bold;
    letter-spacing:.5px;
  }
  .titlebar .dot{width:12px;height:12px;border:2px solid #f5edda;border-radius:50%;flex:none}
  .titlebar .name{font-size:15px}
  .titlebar .name b{color:var(--sun)}
  .titlebar .spacer{flex:1}
  .winbtn{
    width:20px;height:18px;border:2px solid var(--line);
    background:var(--chrome);
    box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo);
    color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  /* ---- menu strip ---- */
  .menu{
    display:flex;gap:2px;flex-wrap:wrap;
    background:var(--chrome);
    padding:4px 6px;
    border-bottom:2px solid var(--line);
    font-family:var(--mono);font-size:12px;
  }
  .menu span{padding:2px 8px}
  .menu span u{text-underline-offset:2px}

  /* ---- body ---- */
  .work{
    background:var(--surface);
    border:2px solid var(--line);
    margin:10px;
    padding:14px;
    box-shadow:inset 2px 2px 0 var(--bevel-lo),inset -2px -2px 0 var(--bevel-hi);
  }
  .hero{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    flex-wrap:wrap;margin-bottom:12px;
  }
  h1{
    margin:0;font-family:var(--mono);font-size:26px;line-height:1;
    letter-spacing:1px;text-transform:uppercase;text-wrap:balance;
  }
  h1 .box{color:var(--accent)}
  .tag3000{
    font-family:var(--mono);font-size:11px;color:var(--accent-ink);
    background:var(--accent);border:2px solid var(--line);
    padding:2px 6px;display:inline-block;vertical-align:middle;
  }
  .subtitle{margin:2px 0 0;font-size:12px;color:var(--ink-soft);font-family:var(--mono)}

  /* ---- progress ---- */
  .progress-wrap{
    background:var(--panel);border:2px solid var(--line);
    padding:10px 12px;margin-bottom:14px;
    box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .progress-label{font-family:var(--mono);font-size:12px;font-weight:bold;white-space:nowrap}
  .meter{
    flex:1;min-width:160px;height:20px;background:#fff;
    border:2px solid var(--line);padding:2px;
    box-shadow:inset 1px 1px 0 var(--bevel-lo);
    display:flex;gap:2px;overflow:hidden;
  }
  .meter i{
    display:block;height:100%;flex:1;background:#d8cba6;
  }
  .meter i.on{background:var(--good)}
  .pct{font-family:var(--mono);font-weight:bold;font-size:13px;min-width:42px;text-align:right}

  /* ---- add form ---- */
  form.adder{
    display:grid;
    grid-template-columns:1fr 150px auto;
    gap:8px;margin-bottom:10px;
  }
  input[type=text],select{
    font-family:var(--sans);font-size:13px;color:var(--ink);
    background:#fff;border:2px solid var(--line);padding:7px 8px;
    box-shadow:inset 1px 1px 0 var(--bevel-lo);
    min-width:0;
  }
  input[type=text]::placeholder{color:#9a8f7c}
  input:focus,select:focus,button:focus-visible{
    outline:2px dashed var(--accent);outline-offset:1px;
  }
  button{
    font-family:var(--mono);font-weight:bold;font-size:13px;cursor:pointer;
    background:var(--chrome);color:var(--ink);border:2px solid var(--line);
    padding:6px 12px;
    box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo-2);
  }
  button:active{
    box-shadow:inset 1px 1px 0 var(--bevel-lo-2),inset -1px -1px 0 var(--bevel-hi);
    transform:translate(1px,1px);
  }
  button.primary{background:var(--accent);color:var(--accent-ink);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(0,0,0,.35);}
  .label-row{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px;font-family:var(--mono);font-size:12px;
  }
  .label-row .chips{display:flex;gap:6px;flex-wrap:wrap}

  /* ---- label chips ---- */
  .chip{
    font-family:var(--mono);font-size:11px;font-weight:bold;
    border:2px solid var(--line);padding:1px 7px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;line-height:1.5;
    user-select:none;
  }
  .chip.dim{opacity:.4}
  .chip .x{font-weight:bold;opacity:.7}
  .chip.add{background:#fff;border-style:dashed}

  /* ---- categories ---- */
  .cat{
    border:2px solid var(--line);margin-bottom:12px;background:var(--panel);
    box-shadow:2px 2px 0 rgba(0,0,0,.08);
  }
  .cat-head{
    display:flex;align-items:center;gap:8px;
    background:var(--titlebar);color:#f5edda;
    padding:6px 10px;cursor:pointer;font-family:var(--mono);font-weight:bold;
  }
  .cat-head .arrow{font-size:10px;width:12px}
  .cat-head .cname{flex:1;letter-spacing:.5px}
  .cat-head .count{
    font-size:11px;background:var(--sun);color:var(--ink);
    border:1px solid var(--line);padding:0 6px;
  }
  .cat-head .del-cat{background:none;border:0;box-shadow:none;color:#f5edda;
    padding:0 4px;font-size:14px;opacity:.7}
  .cat-head .del-cat:hover{opacity:1;color:var(--accent)}
  .cat-body{padding:6px 8px;background:var(--surface);
    border-top:2px solid var(--line)}
  .cat.collapsed .cat-body{display:none}

  /* ---- items ---- */
  .item{
    display:flex;align-items:flex-start;gap:10px;padding:7px 6px;
    border-bottom:1px dashed #c9bb95;
  }
  .item:last-child{border-bottom:0}
  .cbx{
    appearance:none;width:20px;height:20px;flex:none;margin-top:1px;
    background:#fff;border:2px solid var(--line);cursor:pointer;
    box-shadow:inset 1px 1px 0 var(--bevel-lo);position:relative;
  }
  .cbx:checked{background:var(--good)}
  .cbx:checked::after{
    content:"✔";position:absolute;inset:0;color:#fff;font-size:14px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;
  }
  .item-main{flex:1;min-width:0}
  .item-text{font-size:14px;word-break:break-word}
  .item.done .item-text{text-decoration:line-through;color:#9a8f7c}
  .item-labels{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .item-labels .chip{cursor:default}
  .item .del{
    background:none;border:0;box-shadow:none;color:var(--ink-soft);
    font-size:16px;padding:0 4px;line-height:1;flex:none;
  }
  .item .del:hover{color:var(--accent)}
  .empty{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    padding:8px 4px;font-style:italic;
  }

  /* ---- footer strip ---- */
  .statusbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    background:var(--chrome);border-top:2px solid var(--line);
    padding:5px 10px;
  }
  .statusbar .spacer{flex:1}
  .statusbar button{font-size:11px;padding:3px 8px}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}

  @media(max-width:560px){
    form.adder{grid-template-columns:1fr}
    h1{font-size:21px}
  }
</style>

<div class="window">
  <div class="titlebar">
    <span class="dot"></span>
    <span class="name">C:\DORM\<b>PACKER.EXE</b></span>
    <span class="spacer"></span>
    <span class="winbtn">_</span>
    <span class="winbtn">▢</span>
    <span class="winbtn">✕</span>
  </div>
  <div class="menu">
    <span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span>
    <span><u>P</u>ack</span><span><u>H</u>elp</span>
  </div>

  <div class="work">
    <div class="hero">
      <div>
        <h1><span class="box">▓</span> Dorm Packer <span class="tag3000">3000</span></h1>
        <p class="subtitle">// don't forget the shower shoes.</p>
      </div>
    </div>

    <div class="progress-wrap">
      <span class="progress-label">PACKED</span>
      <div class="meter" id="meter"></div>
      <span class="pct" id="pct">0%</span>
    </div>

    <form class="adder" id="adder" autocomplete="off">
      <input type="text" id="itemText" placeholder="Add an item… (e.g. Mattress topper)" maxlength="90" aria-label="Item name">
      <select id="itemCat" aria-label="Category"></select>
      <button type="submit" class="primary">+ ADD</button>
    </form>

    <div class="label-row">
      <span>LABELS:</span>
      <div class="chips" id="labelLegend"></div>
      <button type="button" id="clearFilter" style="display:none;font-size:11px;padding:3px 8px">✕ clear filter</button>
    </div>

    <div id="cats"></div>
  </div>

  <div class="statusbar">
    <span id="stat">Ready<span class="blink">_</span></span>
    <span class="spacer"></span>
    <button type="button" id="addCatBtn">+ New Group</button>
    <button type="button" id="addLabelBtn">+ New Label</button>
    <button type="button" id="resetBtn">Reset</button>
  </div>
</div>

<script>
const KEY="dormPacker3000.v2";
const LABEL_COLORS=["#c9a25e","#b56a4a","#6b8a68","#5f7d8c","#8a6f8e","#a86a6a","#5f8079","#9a7d4e"];

function uid(){return Math.random().toString(36).slice(2,9)}

function seed(){
  const cats=[
    {id:"c1",name:"Bedding",collapsed:false},
    {id:"c2",name:"Bathroom",collapsed:false},
    {id:"c3",name:"Electronics",collapsed:false},
    {id:"c4",name:"Kitchen / Snacks",collapsed:false},
    {id:"c5",name:"Study & Supplies",collapsed:false},
  ];
  const labels=[
    {id:"l1",name:"must-have",color:"#b56a4a"},
    {id:"l2",name:"buy",color:"#c9a25e"},
    {id:"l3",name:"borrow",color:"#5f7d8c"},
    {id:"l4",name:"shared",color:"#6b8a68"},
  ];
  const mk=(text,c,ls)=>({id:uid(),text,categoryId:c,done:false,labelIds:ls||[]});
  const items=[
    mk("XL twin sheets","c1",["l1","l2"]),
    mk("Comforter","c1",["l1"]),
    mk("Pillows (x2)","c1",[]),
    mk("Mattress topper","c1",["l2"]),
    mk("Shower shoes","c2",["l1"]),
    mk("Towels","c2",[]),
    mk("Toiletry caddy","c2",["l2"]),
    mk("Laptop + charger","c3",["l1"]),
    mk("Power strip","c3",["l1","l2"]),
    mk("Mini fridge","c3",["l4","l3"]),
    mk("Reusable water bottle","c4",[]),
    mk("Snacks / ramen","c4",["l2"]),
    mk("Notebooks & pens","c5",["l2"]),
    mk("Desk lamp","c5",["l2"]),
  ];
  return {cats,labels,items,filter:null};
}

let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cats)return s;}catch(e){}
  return seed();
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}

const $=id=>document.getElementById(id);

function status(msg){$("stat").innerHTML=msg+'<span class="blink">_</span>'}

function render(){
  // category select
  const sel=$("itemCat");
  sel.innerHTML=state.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")
    +`<option value="__new">+ New group…</option>`;

  // label legend
  $("labelLegend").innerHTML=state.labels.map(l=>{
    const dim=state.filter&&state.filter!==l.id?"dim":"";
    return `<span class="chip ${dim}" data-lab="${l.id}" style="background:${l.color};color:${textOn(l.color)}">
      ${esc(l.name)} <span class="x" data-dellabel="${l.id}" title="delete label">✕</span></span>`;
  }).join("") || '<span style="color:var(--ink-soft)">none yet</span>';
  $("clearFilter").style.display=state.filter?"inline-block":"none";

  // categories + items
  const wrap=$("cats");
  wrap.innerHTML=state.cats.map(c=>{
    let items=state.items.filter(i=>i.categoryId===c.id);
    if(state.filter)items=items.filter(i=>i.labelIds.includes(state.filter));
    const total=state.items.filter(i=>i.categoryId===c.id).length;
    const done=state.items.filter(i=>i.categoryId===c.id&&i.done).length;
    const body=items.length?items.map(itemHTML).join(""):
      `<div class="empty">${state.filter?"no items match this label.":"empty — add something above."}</div>`;
    return `<div class="cat ${c.collapsed?'collapsed':''}" data-cat="${c.id}">
      <div class="cat-head" data-toggle="${c.id}">
        <span class="arrow">${c.collapsed?'►':'▼'}</span>
        <span class="cname">${esc(c.name.toUpperCase())}</span>
        <span class="count">${done}/${total}</span>
        <button class="del-cat" data-delcat="${c.id}" title="delete group">✕</button>
      </div>
      <div class="cat-body">${body}</div>
    </div>`;
  }).join("") || '<div class="empty">No groups yet. Click “+ New Group”.</div>';

  // progress
  const all=state.items.length, packed=state.items.filter(i=>i.done).length;
  const pct=all?Math.round(packed/all*100):0;
  const segs=20;const filled=Math.round(pct/100*segs);
  $("meter").innerHTML=Array.from({length:segs},(_,k)=>`<i class="${k<filled?'on':''}"></i>`).join("");
  $("pct").textContent=pct+"%";
  save();
}

function itemHTML(i){
  const labs=i.labelIds.map(id=>{
    const l=state.labels.find(x=>x.id===id);if(!l)return"";
    return `<span class="chip" style="background:${l.color};color:${textOn(l.color)}">${esc(l.name)}</span>`;
  }).join("");
  const avail=state.labels.filter(l=>!i.labelIds.includes(l.id));
  const addChip=avail.length?`<span class="chip add" data-addlab="${i.id}" title="add label">+ label</span>`:"";
  return `<div class="item ${i.done?'done':''}" data-item="${i.id}">
    <input type="checkbox" class="cbx" ${i.done?'checked':''} data-check="${i.id}" aria-label="packed">
    <div class="item-main">
      <div class="item-text">${esc(i.text)}</div>
      <div class="item-labels">${labs}${addChip}</div>
    </div>
    <button class="del" data-delitem="${i.id}" title="delete">🗑</button>
  </div>`;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function textOn(hex){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  return (r*299+g*587+b*114)/1000>150?"#241f1a":"#fff3ec";
}

/* ---------- events ---------- */
$("adder").addEventListener("submit",e=>{
  e.preventDefault();
  const t=$("itemText").value.trim();if(!t)return;
  let cat=$("itemCat").value;
  if(cat==="__new"){cat=newCategory();if(!cat){$("itemCat").value=state.cats[0]?.id||"";return}}
  state.items.push({id:uid(),text:t,categoryId:cat,done:false,labelIds:[]});
  $("itemText").value="";
  status("added &quot;"+esc(t)+"&quot;");
  render();$("itemText").focus();
});

$("itemCat").addEventListener("change",e=>{
  if(e.target.value==="__new"){const c=newCategory();e.target.value=c||state.cats[0]?.id||"";render();}
});

document.addEventListener("click",e=>{
  const t=e.target;
  const g=(a)=>t.getAttribute(a);
  if(g("data-check")!==null){
    const i=state.items.find(x=>x.id===g("data-check"));i.done=t.checked;
    status(i.done?"packed ✓":"unpacked");render();return;
  }
  if(g("data-toggle")!==null && !t.closest(".del-cat")){
    const c=state.cats.find(x=>x.id===g("data-toggle"));c.collapsed=!c.collapsed;render();return;
  }
  if(g("data-delitem")){state.items=state.items.filter(x=>x.id!==g("data-delitem"));status("item deleted");render();return;}
  if(g("data-delcat")){
    const c=state.cats.find(x=>x.id===g("data-delcat"));
    const n=state.items.filter(i=>i.categoryId===c.id).length;
    if(confirm(`Delete group "${c.name}"`+(n?` and its ${n} item(s)?`:"?"))){
      state.cats=state.cats.filter(x=>x.id!==c.id);
      state.items=state.items.filter(i=>i.categoryId!==c.id);
      render();
    }return;
  }
  if(g("data-lab")&&!t.closest(".x")){
    const id=g("data-lab");state.filter=state.filter===id?null:id;
    status(state.filter?"filtering by label":"filter cleared");render();return;
  }
  if(g("data-dellabel")){
    const l=state.labels.find(x=>x.id===g("data-dellabel"));
    if(confirm(`Delete label "${l.name}"? It will be removed from all items.`)){
      state.labels=state.labels.filter(x=>x.id!==l.id);
      state.items.forEach(i=>i.labelIds=i.labelIds.filter(x=>x!==l.id));
      if(state.filter===l.id)state.filter=null;
      render();
    }return;
  }
  if(g("data-addlab")){openLabelPicker(g("data-addlab"),t);return;}
});

$("clearFilter").addEventListener("click",()=>{state.filter=null;render()});
$("addCatBtn").addEventListener("click",()=>{if(newCategory())render()});
$("addLabelBtn").addEventListener("click",()=>{if(newLabel())render()});
$("resetBtn").addEventListener("click",()=>{
  if(confirm("Reset everything back to the starter list? This erases your changes.")){
    state=seed();render();status("reset to defaults");
  }
});

function newCategory(){
  const name=prompt("Name your new group (e.g. Laundry, Decor):");
  if(!name||!name.trim())return null;
  const c={id:uid(),name:name.trim(),collapsed:false};
  state.cats.push(c);return c.id;
}
function newLabel(){
  const name=prompt("New label name (e.g. urgent, ask-roommate):");
  if(!name||!name.trim())return null;
  const color=LABEL_COLORS[state.labels.length%LABEL_COLORS.length];
  const l={id:uid(),name:name.trim(),color};state.labels.push(l);return l.id;
}

/* simple inline label picker */
function openLabelPicker(itemId,anchor){
  const item=state.items.find(i=>i.id===itemId);
  const avail=state.labels.filter(l=>!item.labelIds.includes(l.id));
  let list=avail.map(l=>l.name).map((n,i)=>`${i+1}. ${n}`).join("\n");
  const ans=prompt(`Add a label to "${item.text}":\n\n${list}\n\nType the number, or a NEW label name:`);
  if(ans===null)return;
  const num=parseInt(ans,10);
  if(!isNaN(num)&&avail[num-1]){item.labelIds.push(avail[num-1].id);}
  else if(ans.trim()){
    let ex=state.labels.find(l=>l.name.toLowerCase()===ans.trim().toLowerCase());
    if(!ex){const id=uid();ex={id,name:ans.trim(),color:LABEL_COLORS[state.labels.length%LABEL_COLORS.length]};state.labels.push(ex);}
    if(!item.labelIds.includes(ex.id))item.labelIds.push(ex.id);
  }
  render();
}

render();
</script>
